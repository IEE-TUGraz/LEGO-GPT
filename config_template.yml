input_type: sqlite  # sqlite, V2G or excel
input_dir: PATH_TO_LEGO_RESULTS

# Tables to load (names must match SQLite table names or Excel processing logic)
tables:
  - rp                # Representative periods
  - k                 # Time steps
  - i                 # Nodes/buses
  - g                 # Generators
  - gi                # Generator-node mapping (technology inferred from name)
  - la                # Lines/branches
  - vLineP            # Active power flow
  - vLineQ            # Reactive power flow (optional)
  - vGenP             # Generator active power
  - vSOCP_cii         # Voltage (SOCP  node injection formulation)
  - vSOCP_ui          # Voltage (SOCP branch flow formulation)
  - pPmax             # Line thermal limits
  - vStIntraRes       # Storage state of charge
  - coords            # Node coordinates (dummy created if not present)
  - voltage_bounds    # Voltage bounds per node
  ###############
  # V2G-specific tables
  ###############
  - ev                # Electric vehicles set (V2G)
  - ev_availability   # EV availability at nodes (V2G)
  - vDchEV            # EV discharge (V2G)
  - vChEV             # EV charge (V2G)
  - vSocEV            # EV state of charge (V2G)

dropdown_options_y:
  - label: "Y: Dispatch"
    value: "dispatch"
  - label: "Y: Power Flow"
    value: "power_flow"
  - label: "Y: Demand"
    value: "demand"

dropdown_options_x:
  - label: "X: Time"
    value: "time"
  - label: "X: Generator"
    value: "generator"
  - label: "X: Line"
    value: "line"

map_options:
  line_weight: 2
  default_zoom: 5
  arrow_zoom_scale: 0.5
  arrow_min_size: 0.5
  pie_chart_min_radius: 8
  pie_chart_max_radius: 16

  technology_colors:
    Wind: "#2ecc71"
    Solar: "#27ae60"
    OtherRES: "#1e8449"
    Offshore: "#145a32"
    CSP: "#117a65"
    Coal: "#c0392b"
    Gas: "#e74c3c"
    Oil: "#a93226"
    OtherNoRES: "#922b21"
    Nuclear: "#7b241c"
    HS: "#3498db"
    HPS: "#2e86c1"
    RoR: "#21618c"
    BESS: "#7f8c8d"
    "BESS Discharge": "#bdc3c7"
    V2G_charging: "#8e44ad"
    V2G_discharging: "#9b59b6"
    unknown: "#808080"
    no_generation: "#000000"
    vres: "#2ecc71"
    thermal: "#c0392b"
    storage: "#7f8c8d"
    Hydro: "#2878ad"

  cluster_options:
    cluster_radius: 60
    maxZoom: 16


graph_options:
  graph_save_options:
    toImageButtonOptions:
      format: svg
      filename: custom_image
      height: 500
      width: 700
      scale: 1

  layout:
    xaxis:
      domain: [ 0, 0.85 ]
      title:
        font:
          size: 18
          color: black
    yaxis:
      domain: [ 0, 1 ]
      title:
        font:
          size: 18
          color: black
    legend:
      x: 0.85
      y: 1
      xanchor: left
      yanchor: top
    margin:
      l: 0
      r: 40
      t: 40
      b: 40
    paper_bgcolor: "#E1EDED"
    plot_bgcolor: "#E1EDED"
    font:
      size: 14
    title:
      x: 0.5
  colors:
    - "#2E86AB"
    - "#F6C85F"
