input_type: excel # excel, sqlite  or V2G
input_dir: "path_to_directory" # directory with the input

tables:
  - rp
  - k
  - i
  - g
  - gi
  - la
  - vLineP
  - vGenP
  - vStIntraRes
  - vStInterRes
  - pDemandP
  - pPmax

dropdown_options_y:
  - label: "Y: Dispatch"
    value: "dispatch"
  - label: "Y: Power Flow"
    value: "power_flow"
  - label: "Y: Demand"
    value: "demand"

dropdown_options_x:
  - label: "X: Time"
    value: "time"
  - label: "X: Generator"
    value: "generator"
  - label: "X: Line"
    value: "line"

map_options:
  line_weight: 2
  default_zoom: 7
  arrow_zoom_scale: 1.2
  arrow_min_size: 0.5
  node_zoom_scale: 0.9
  node_min_size: 1.5